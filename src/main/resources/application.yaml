server:
  port: ${PORT:8080}
spring:
  application:
    name: wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
  cache-names: fxRates
  caffeine:
    spec: expireAfterWrite=1h,maximumSize=100
app:
  fx-api-url: ${FX_API_URL:https://api.frankfurter.dev/v1}
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
  jwt-expiration-ms: 3600000
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}