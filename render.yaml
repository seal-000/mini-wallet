services:
  - type: web
    name: wallet-api
    runtime: docker
    plan: free
    healthCheckPath: /api/auth/login
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ACCOUNT_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
